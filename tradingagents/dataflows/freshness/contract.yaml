# DataCollector task key -> freshness contract entry
stock_data:
  category: calendar_anchored
  criticality: critical
  grace_minutes: 30
  anchor_field: last_bar_date

indicators:
  category: calendar_anchored
  criticality: critical
  grace_minutes: 0
  inherit_from: stock_data

individual_fund_flow:
  category: calendar_anchored
  criticality: critical
  grace_minutes: 120
  anchor_field: last_row_date
  collector_keys: [fund_flow_individual]

board_fund_flow:
  category: calendar_anchored
  criticality: important
  grace_minutes: 90
  anchor_field: snapshot_date
  collector_keys: [fund_flow_board]

zt_pool:
  category: calendar_anchored
  criticality: important
  grace_minutes: 60
  anchor_field: request_date

lhb_detail:
  category: conditional_daily
  criticality: critical
  grace_minutes: 0
  anchor_field: request_date
  empty_ok: true
  collector_keys: [lhb]

fundamentals:
  category: disclosure_period
  criticality: important

balance_sheet:
  category: disclosure_period
  criticality: important

cashflow:
  category: disclosure_period
  criticality: important

income_statement:
  category: disclosure_period
  criticality: important

news:
  category: event_driven
  criticality: informational
  window_hours: 72

global_news:
  category: event_driven
  criticality: informational
  window_hours: 72

hot_stocks_xq:
  category: event_driven
  criticality: informational
  window_hours: 6
  collector_keys: [hot_stocks]

insider_transactions:
  category: event_driven
  criticality: informational
  window_hours: 720

realtime_quotes:
  category: calendar_anchored
  criticality: important
  grace_minutes: 0
  intraday_only: true

# --- 对话式研判引入的源 ---------------------------------------------------
# 分时承接是判定「下跌中有没有人接」的唯一来源，但它的可得性依赖接口与
# 交易日：盘中/盘后尚未落定、或接口不提供历史分钟数据时都拿不到。
# 因此按条件日度处理，缺失不算 stale（不算「数据过时」），由信号层显式
# 报告 unavailable —— 「拿不到」与「拿到了但旧」是两种不同状态。
intraday_bars:
  category: conditional_daily
  criticality: important
  grace_minutes: 0
  anchor_field: request_date
  empty_ok: true

# 筹码分布随日线更新，且只在交易日结束后才稳定。
chip_distribution:
  category: calendar_anchored
  criticality: important
  grace_minutes: 120
  anchor_field: last_row_date

# 个股新闻：事件型，只在窗口内判定新鲜度，不参与交易日锚点比较。
symbol_news:
  category: event_driven
  criticality: informational
  freshness_window_hours: 72
