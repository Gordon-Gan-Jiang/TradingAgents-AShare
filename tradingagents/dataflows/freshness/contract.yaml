# DataCollector task key -> freshness contract entry
#
# --- 报告管线（DataCollector）的采集范围 ------------------------------------
# 下面这份清单声明的是「报告管线**自己负责取**的源」。它只影响一件事：
# 某个源**没出现在本轮采集结果里**时，该判成"该采没采到"（error），还是
# "不归这条管线管"（not_applicable）。
#
# 为什么必须显式声明、不能拿「契约里所有源」代替：两者语义不同——契约是
# "全项目认识的源"，采集范围是"这条管线该有的数"。混用已经造成过真实事故：
# `intraday_bars` / `chip_distribution` / `symbol_news` 三个源是为**工具/对话
# 路径**加进契约的，报告管线从不采它们，却被当成"该采没采到"→ 一律判 error
# +「数据源返回空」→ overall 变「数据异常」→ 置信度被 CONFIDENCE_CAPS['error']
# 硬压到 40，并被写进终审正文（"当前数据异常，方向置信度受限于 40"、
# "L0：intraday_bars / chip_distribution 未恢复 → 0% 真实新开仓"）。
# 而当时那两个源实测完全可用（baostock 分时、新浪日线自算筹码都取到了）。
#
# 极性刻意选「正向声明本管线采什么」（默认不在范围内）：本项目的契约增长方向
# 是工具/对话路径，若反过来默认"在范围内"，下一个为工具新增的源会**再次**静默
# 变成报告管线的假故障。工具/对话路径本来就用 evaluate_tool_sources 显式声明
# 自己的源与 unavailable，不需要这张表。
report_pipeline_sources:
  - stock_data
  - indicators
  - individual_fund_flow
  - board_fund_flow
  - zt_pool
  - lhb_detail
  - fundamentals
  - balance_sheet
  - cashflow
  - income_statement
  - news
  - global_news
  - hot_stocks_xq
  - insider_transactions
  - realtime_quotes

stock_data:
  category: calendar_anchored
  criticality: critical
  grace_minutes: 30
  anchor_field: last_bar_date

indicators:
  category: calendar_anchored
  criticality: critical
  grace_minutes: 0
  inherit_from: stock_data

individual_fund_flow:
  category: calendar_anchored
  criticality: critical
  grace_minutes: 120
  anchor_field: last_row_date
  collector_keys: [fund_flow_individual]

board_fund_flow:
  category: calendar_anchored
  criticality: important
  grace_minutes: 90
  anchor_field: snapshot_date
  collector_keys: [fund_flow_board]

zt_pool:
  category: calendar_anchored
  criticality: important
  grace_minutes: 60
  anchor_field: request_date

lhb_detail:
  category: conditional_daily
  criticality: critical
  grace_minutes: 0
  anchor_field: request_date
  empty_ok: true
  collector_keys: [lhb]

fundamentals:
  category: disclosure_period
  criticality: important

balance_sheet:
  category: disclosure_period
  criticality: important

cashflow:
  category: disclosure_period
  criticality: important

income_statement:
  category: disclosure_period
  criticality: important

news:
  category: event_driven
  criticality: informational
  window_hours: 72

global_news:
  category: event_driven
  criticality: informational
  window_hours: 72

hot_stocks_xq:
  category: event_driven
  criticality: informational
  window_hours: 6
  collector_keys: [hot_stocks]

insider_transactions:
  category: event_driven
  criticality: informational
  window_hours: 720

realtime_quotes:
  category: calendar_anchored
  criticality: important
  grace_minutes: 0
  intraday_only: true

# --- 对话式研判引入的源 ---------------------------------------------------
# 分时承接是判定「下跌中有没有人接」的唯一来源，但它的可得性依赖接口与
# 交易日：盘中/盘后尚未落定、或接口不提供历史分钟数据时都拿不到。
# 因此按条件日度处理，缺失不算 stale（不算「数据过时」），由信号层显式
# 报告 unavailable —— 「拿不到」与「拿到了但旧」是两种不同状态。
intraday_bars:
  category: conditional_daily
  criticality: important
  grace_minutes: 0
  anchor_field: request_date
  empty_ok: true

# 筹码分布随日线更新，且只在交易日结束后才稳定。
chip_distribution:
  category: calendar_anchored
  criticality: important
  grace_minutes: 120
  anchor_field: last_row_date

# 个股新闻：事件型，只在窗口内判定新鲜度，不参与交易日锚点比较。
symbol_news:
  category: event_driven
  criticality: informational
  freshness_window_hours: 72
